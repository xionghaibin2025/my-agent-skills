name: scienceplots
version: 1.0.0
description: >
  Declarative manifest for the SciencePlots skill. SKILL.md uses this to
  decide which fragments to load for a given plotting request. The main axis
  is the target output (journal type or general), which determines figure
  dimensions, fonts, DPI, and style combinations.

always_load:
  - static/core/setup.md
  - static/core/style-defaults.md

axes:
  target:
    detect: |
      Determine the target output from the user's request:
      - "ieee" → user wants IEEE Transactions formatting (single-column,
        serif fonts, 600 DPI)
      - "nature" → user wants Nature journal formatting (sans-serif,
        89mm single-column width)
      - "general" → any other scientific figure, notebook, presentation,
        or unspecified target
      If the user mentions a specific journal, match it. Otherwise default
      to "general".
    values:
      ieee:    static/fragments/journal/ieee.md
      nature:  static/fragments/journal/nature.md
      general: static/fragments/journal/general.md
    multi: false

references:
  on_demand:
    - condition: user asks about available styles, color schemes, or wants to browse options
      path: references/styles-catalog.md
    - condition: user needs guidance on combining styles, cascading rules, or best practices
      path: references/usage-guide.md
    - condition: installation errors, LaTeX issues, CJK font problems, rendering failures
      path: references/troubleshooting.md
    - condition: need plt.style.use / plt.style.context API details, custom overrides, rcParams
      path: references/api-reference.md
    - condition: user wants ready-to-use code for specific chart types or multi-panel layouts
      path: references/code-templates.md
    - condition: user wants a quick working example to get started
      path: examples/quick-examples.md
